<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <title>太古小學 - 放學指示系統</title>
  <link rel="stylesheet" href="/css/style.css?v=20261105e">
</head>
<body data-page="display">

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p>系統連線中，請稍候...</p>
  </div>

  <div id="noticeModal" class="notice-modal-overlay">
    <div class="notice-modal-card">
      <button id="btnCloseNoticeModal" class="modal-close-btn" type="button" aria-label="關閉通告">×</button>
      <div class="notice-modal-header">重要通告</div>
      <div id="noticeModalBody" class="notice-modal-body">--</div>
    </div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand-lockup">
        <img src="/images/logo.png" alt="放學廣播" class="school-logo">
        <div>
          <div class="school-name">太古小學</div>
          <div class="school-sub">放學指示</div>
        </div>
      </div>
      <div class="header-right-tools">
        <button id="btnToggleAudio" class="audio-state" type="button">廣播未開啟</button>
        <div id="liveClock" class="header-clock">--:--:--</div>
      </div>
    </header>

    <main id="displayView" class="view-section active">
      <div class="card active-dismissal-card">
        <div class="card-title">正在放學班別</div>
        <div id="activeClassesWrapper" class="active-wrapper">
          <span class="placeholder-text">現時沒有班別放學中</span>
        </div>
      </div>

      <div class="card status-overview-card">
        <div class="card-title">全校各班放學狀態</div>
        <div id="displayClassGrid" class="class-grid-large"></div>
      </div>
    </main>

    <footer class="app-footer">由太古小學開發 版權歸太古小學所有</footer>
  </div>

  <script type="module" src="/js/app.js?v=20261105e"></script>
</body>
</html>
