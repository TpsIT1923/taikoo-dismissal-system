<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太古小學 - 放學指示系統</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- 全局 Loading 覆蓋層 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p>系統連線中，請稍候...</p>
  </div>

  <div class="app-container">
    <!-- 強制頁首 Header (嚴格遵從守則 [3] inline style + 右上角固定時鐘) -->
    <header style="display: flex; align-items: center; gap: 10px; padding: 4px 0; position: relative; height: 45px; flex-shrink: 0;">
      <img src="https://i.postimg.cc/0N0Ktx79/images_(1).png" alt="太古小學 Logo" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(0,0,0,0.1); flex-shrink: 0;">
      <span style="font-size: 18px; font-weight: bold; white-space: nowrap;">太古小學放學指示系統</span>
      <div id="liveClock" class="header-clock">--:--:--</div>
    </header>

    <!-- 視圖切換導航 -->
    <nav class="view-toggle">
      <button id="btnShowDisplay" class="nav-btn active">📺 大螢幕展示屏 (家長)</button>
      <button id="btnShowControl" class="nav-btn">📱 地下控制台 (老師)</button>
    </nav>

    <!-- 視圖 1：大螢幕展示屏 -->
    <main id="displayView" class="view-section active">
      <div class="card active-dismissal-card">
        <div class="card-title">正在放學班別</div>
        <div id="activeClassesWrapper" class="active-wrapper">
          <span class="placeholder-text">現時沒有班別放學中</span>
        </div>
      </div>

      <div class="card status-overview-card">
        <div class="card-title">全校各班放學狀態</div>
        <div id="displayClassGrid" class="class-grid-large">
          <!-- 30 班狀態列表 -->
        </div>
      </div>
    </main>

    <!-- 視圖 2：地下控制台 -->
    <main id="controlView" class="view-section">
      <div class="card control-panel">
        <div class="control-header">
          <div class="card-title">放學控制台</div>
          <button id="btnResetAll" class="btn-reset">🔄 重置所有班別</button>
        </div>
        <p class="subtitle">點擊班別開啟「正在放學」（3分鐘後自動歸類為已放學）</p>
        <div id="controlClassGrid" class="class-grid-interactive">
          <!-- 互動按鈕網格 -->
        </div>
      </div>
    </main>

    <!-- 版權 Footer (嚴格遵從守則 [3]) -->
    <footer style="text-align: center; padding: 4px 0; font-size: 11px; color: #666; flex-shrink: 0;">
      由太古小學開發 版權歸太古小學所有
    </footer>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
