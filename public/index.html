<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太古小學 - 放學指示系統</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- 全局 Loading 覆蓋層 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p>系統連線中，請稍候...</p>
  </div>

  <div class="app-container">
    <!-- 強制頁首 Header -->
    <header style="display: flex; align-items: center; gap: 12px; padding: 10px 0; margin-bottom: 20px;">
      <img src="https://i.postimg.cc/0N0Ktx79/images_(1).png" alt="太古小學 Logo" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(0,0,0,0.1);">
      <span style="font-size: 22px; font-weight: bold;">太古小學放學指示系統</span>
    </header>

    <!-- 視圖切換導航 -->
    <nav class="view-toggle">
      <button id="btnShowDisplay" class="nav-btn active">📺 大螢幕展示屏 (家長)</button>
      <button id="btnShowControl" class="nav-btn">📱 地下控制台 (老師)</button>
    </nav>

    <!-- 視圖 1：大螢幕展示屏 -->
    <main id="displayView" class="view-section active">
      <!-- 正在放學班別卡片 -->
      <div class="card active-dismissal-card">
        <h2>正在放學班別</h2>
        <div id="activeClassesWrapper" class="active-wrapper">
          <span class="placeholder-text">現時沒有班別放學中</span>
        </div>
      </div>

      <!-- 全校各班放學狀態（放大佔據主要視圖 80%） -->
      <div class="card status-overview-card">
        <h2>全校各班放學狀態</h2>
        <div id="displayClassGrid" class="class-grid-large">
          <!-- 班別狀態列表 -->
        </div>
      </div>
    </main>

    <!-- 視圖 2：地下控制台 -->
    <main id="controlView" class="view-section">
      <div class="card control-panel">
        <div class="control-header">
          <h2>放學控制台</h2>
          <button id="btnResetAll" class="btn-reset">🔄 重置所有班別</button>
        </div>
        <p class="subtitle">點擊班別開啟「正在放學」（3分鐘後自動歸類為已放學）</p>
        <div id="controlClassGrid" class="class-grid-interactive">
          <!-- 互動按鈕網格 -->
        </div>
      </div>
    </main>

    <!-- 版權 Footer -->
    <footer style="text-align: center; margin-top: 30px; padding: 10px; font-size: 12px; color: #666;">
      由太古小學開發 版權歸太古小學所有
    </footer>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
